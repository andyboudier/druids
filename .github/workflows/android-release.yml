name: Build Android AAB

# Manual trigger only. Run this from the repo's Actions tab whenever you want a
# fresh Play Store bundle — it does NOT run on every web commit. The finished
# signed .aab is (1) attached to the run as an artifact and (2) published as an
# asset on a GitHub Release (tag android-v<versionCode>) so it has a permanent,
# direct download link. Optionally pass a versionCode; it defaults to the run
# number.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (leave blank to use the run number)'
        required: false
        default: ''
      publish_to_play:
        description: 'Upload the .aab to Google Play (needs the PLAY_SERVICE_ACCOUNT_JSON secret)'
        type: boolean
        required: false
        default: true
      play_track:
        description: 'Google Play track to upload to'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: write   # needed to publish the .aab as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DLPC_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
    defaults:
      run:
        working-directory: druids-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Decode upload keystore
        run: |
          echo "$DLPC_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "Keystore written: $(wc -c < android/app/upload-keystore.jks) bytes"
        env:
          DLPC_KEYSTORE_BASE64: ${{ secrets.DLPC_KEYSTORE_BASE64 }}

      - name: Build signed release bundle
        run: cd android && ./gradlew bundleRelease --no-daemon
        env:
          DLPC_KEYSTORE_FILE: upload-keystore.jks
          DLPC_KEYSTORE_PASSWORD: ${{ secrets.DLPC_KEYSTORE_PASSWORD }}
          DLPC_KEY_ALIAS: ${{ secrets.DLPC_KEY_ALIAS }}
          DLPC_KEY_PASSWORD: ${{ secrets.DLPC_KEY_PASSWORD }}
          # DLPC_VERSION_CODE is inherited from the job-level env above.

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlpc-chukkas-release-aab
          path: druids-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish AAB to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-v${DLPC_VERSION_CODE}"
          ASSET="dlpc-poloact-v${DLPC_VERSION_CODE}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "DLPC PoloACT Android — versionCode ${DLPC_VERSION_CODE}" \
              --notes "Signed Android App Bundle (versionCode ${DLPC_VERSION_CODE}) for upload to the Google Play Console." \
              --latest
          fi
          echo "Release asset published: $ASSET on tag $TAG"

      # ── Optional: upload straight to Google Play ────────────────────────────
      # Dormant until you add the PLAY_SERVICE_ACCOUNT_JSON secret (a Google Play
      # Developer API service-account key). Then each run also uploads the .aab
      # to the chosen track (default: internal testing). Set publish_to_play=false
      # to build the .aab without uploading.
      - name: Check for Play service-account secret
        id: playcheck
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SA" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload."; fi

      - name: Upload to Google Play
        if: ${{ github.event.inputs.publish_to_play != 'false' && steps.playcheck.outputs.present == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.co.druidspolo.poloact
          releaseFiles: druids-app/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
