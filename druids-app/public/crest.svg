<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Druids Lodge Polo Club crest">
  <title>Druids Lodge Polo Club</title>

  <!-- Four golden druid sickles, pinwheeled at 90° about the centre. -->
  <g transform="translate(512 0) scale(-1 1)">
    <g fill="none" stroke="#FDB515" stroke-width="24" stroke-linecap="round">
      <path d="M 216 206 L 216 112 A 40 40 0 1 1 284.3 140.3" />
      <path d="M 216 206 L 216 112 A 40 40 0 1 1 284.3 140.3" transform="rotate(90 256 256)" />
      <path d="M 216 206 L 216 112 A 40 40 0 1 1 284.3 140.3" transform="rotate(180 256 256)" />
      <path d="M 216 206 L 216 112 A 40 40 0 1 1 284.3 140.3" transform="rotate(270 256 256)" />
    </g>
  </g>

  <!-- Two crossed polo mallets: shaft, angled cigar head, wrist-sling curl. -->
  <g fill="#FFFFFF" stroke="#FFFFFF">
    <g transform="rotate(45 256 256)">
      <path d="M 256 60 L 256 424" stroke-width="12" stroke-linecap="butt" fill="none" />
      <rect x="204" y="414" width="104" height="26" rx="13" transform="rotate(56 256 427)" stroke="none" />
      <path d="M 256 60 A 12 12 0 1 1 249 49.5" stroke-width="9" stroke-linecap="round" fill="none" />
    </g>
    <g transform="rotate(-45 256 256)">
      <path d="M 256 60 L 256 424" stroke-width="12" stroke-linecap="butt" fill="none" />
      <rect x="204" y="414" width="104" height="26" rx="13" transform="rotate(56 256 427)" stroke="none" />
      <path d="M 256 60 A 12 12 0 1 1 249 49.5" stroke-width="9" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
